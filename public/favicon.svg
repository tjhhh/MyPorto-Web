<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4E121A" />
      <stop offset="55%" stop-color="#24070B" />
      <stop offset="100%" stop-color="#120305" />
    </radialGradient>

    <!-- Outer Border Gold Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EEDD" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#D8C5A5" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#A8906E" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#5A171F" stop-opacity="0.4" />
    </linearGradient>

    <!-- Primary Monogram Gold Gradient -->
    <linearGradient id="mfGold" x1="15%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F5E8D2" />
      <stop offset="60%" stop-color="#D8C5A5" />
      <stop offset="100%" stop-color="#B39366" />
    </linearGradient>

    <!-- F Crossbar Ember-Gold Accent Gradient -->
    <linearGradient id="fAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E8D2" />
      <stop offset="60%" stop-color="#D8C5A5" />
      <stop offset="100%" stop-color="#E07A5F" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Monogram Depth -->
    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7B232E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Plate: Architectural Rounded Square -->
  <rect
    x="6"
    y="6"
    width="88"
    height="88"
    rx="20"
    fill="url(#bgRadial)"
    stroke="url(#borderGrad)"
    stroke-width="1.8"
  />

  <!-- Subtle Geometric Inner Watermark Grid -->
  <rect
    x="11"
    y="11"
    width="78"
    height="78"
    rx="15"
    fill="none"
    stroke="#D8C5A5"
    stroke-width="0.75"
    stroke-dasharray="2 3"
    opacity="0.25"
  />

  <!-- 4 Architectural Precision Corner Brackets -->
  <g stroke="#D8C5A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <path d="M 12 21 L 12 12 L 21 12" />
    <path d="M 79 12 L 88 12 L 88 21" />
    <path d="M 12 79 L 12 88 L 21 88" />
    <path d="M 79 88 L 88 88 L 88 79" />
  </g>

  <!-- The MF Interlocking Monogram Geometry -->
  <g filter="url(#monogramGlow)">
    <!-- Letter M Core Path: Left Stem -> Center Vertex -> Right Stem -->
    <path
      d="M 24 73 L 24 27 L 44 51 L 64 27 L 64 73"
      fill="none"
      stroke="url(#mfGold)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter F Top Horizontal Beam -->
    <path
      d="M 64 27 L 81 27"
      fill="none"
      stroke="url(#mfGold)"
      stroke-width="7.5"
      stroke-linecap="round"
    />

    <!-- Letter F Middle Horizontal Cantilever -->
    <path
      d="M 64 50 L 76 50"
      fill="none"
      stroke="url(#fAccent)"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Central Diamond Talisman Keystone -->
    <polygon
      points="44,46 48,51 44,56 40,51"
      fill="#FFF9F0"
    />

    <!-- Subtle Terminal Accent Dot on F Beam -->
    <circle cx="76" cy="50" r="1.5" fill="#FFF5E5" />
  </g>
</svg>
